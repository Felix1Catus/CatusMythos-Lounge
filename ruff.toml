target-version = "py38"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]
# Escaped braces occur in generated-code templates, so auto-fixing F541 can
# change the output. The remaining ignored rules are formatting choices or
# import placement required by the standalone skill/hook loading model.
ignore = ["E402", "E702", "E731", "F541"]
