name: Core assessment release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  regression:
    name: Unit and contract tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared optional dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Install Chromium for browser regressions (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium for browser regressions (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Run regression suite
        run: python -m pytest -q
      - name: Run static and documentation checks
        shell: bash
        run: |
          python -m ruff check .
          python -m compileall -q scripts skills tests
          python scripts/check_common_sync.py
          python scripts/check_skill_cli_docs.py
          git diff --check

  vulnerable-labs:
    name: Pinned DVWA, Juice Shop, and crAPI release benchmark
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install scanner and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m playwright install --with-deps chromium
      - name: Verify Docker engine
        run: docker info
      - name: Provision loopback labs, run scans, and enforce gold cases
        run: python scripts/run_core_lab_ci.py --output targets/benchmark/core-lab-release.json
      - name: Upload sanitized benchmark report
        if: always() && hashFiles('targets/benchmark/core-lab-release.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: core-lab-release-report
          path: targets/benchmark/core-lab-release.json
          if-no-files-found: error
